<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Desk</title>
<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
.container{display:flex;height:100vh}
.sidebar{width:230px;background:#151f2d;padding:20px}
.logo{font-size:22px;font-weight:bold;margin-bottom:25px;color:#2AABEE}
.channel{padding:14px;margin-bottom:12px;background:#1d2a3a;border-radius:12px;cursor:pointer}
.channel:hover{background:#2b3d52}
.main{flex:1;padding:20px}
iframe{width:100%;height:90vh;border:none;border-radius:16px}
</style>
</head>
<body>

<div class="container">

<div class="sidebar">
<div class="logo">Pulse Desk</div>

<div class="channel" onclick="loadChannel('m0unt3FX')">
Trade Signals
</div>

<div class="channel" onclick="loadChannel('Trader_lCT')">
Market Intel
</div>

</div>

<div class="main">
<iframe id="feed" src="https://t.me/s/m0unt3FX"></iframe>
</div>

</div>

<script>
function loadChannel(channel){
document.getElementById('feed').src='https://t.me/s/'+channel;
}
</script>

</body>
</html>
